name: Automated S24 Ultra Native APK Compiler Pipeline

on:
  push:
    branches:
      - main

jobs:
  compile-native-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Pull down repository source code
        uses: actions/checkout@v4

      - name: 2. Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Set up Node.js Lifecycle
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 4. Initialize Core Workspace Directory Structure
        run: |
          mkdir local-build-workspace
          cd local-build-workspace
          
          # Force fabricate the explicit structural manifest mapping for stable SDK 50
          cat <<EOF > package.json
          {
            "name": "drc-elite-golf",
            "version": "1.0.0",
            "scripts": { "android": "expo run:android" },
            "dependencies": {
              "@react-native-async-storage/async-storage": "1.21.0",
              "@react-native-voice/voice": "3.2.4",
              "expo": "~50.0.14",
              "expo-linear-gradient": "~12.3.0",
              "expo-location": "~16.5.5",
              "react": "18.2.0",
              "react-native": "0.73.6",
              "react-native-safe-area-context": "4.8.2",
              "react-native-tts": "4.1.0"
            },
            "private": true
          }
          EOF

          # Inject our operational core app script directly into the build workspace
          cp ../App.js ./App.js
          cp ../app.json ./app.json
          
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: 5. Compile Native Android Source Build
        run: |
          cd local-build-workspace
          npx expo prebuild --platform android --clean
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 6. Upload Finished App Link Direct to Your Phone
        uses: actions/upload-artifact@v4
        with:
          name: drc-elite-golf-s24-ultra
          path: local-build-workspace/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
