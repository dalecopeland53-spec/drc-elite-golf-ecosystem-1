name: Automated S24 Ultra Native APK Compiler Pipeline

on:
  push:
    branches:
      - main

jobs:
  compile-native-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Pull down repository source code
        uses: actions/checkout@v4

      - name: 2. Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Set up Node.js Lifecycle
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 4. Initialize Core Android Template Workspace
        run: |
          # Use the strict native React Native CLI to bypass Expo prebuild engines completely
          npx react-native init localbuildworkspace --version 0.73.6 --skip-install --yes
          
          # Inject your custom operational App.js script straight into the native compilation path
          cp App.js localbuildworkspace/App.js
          
          cd localbuildworkspace
          
          # Force set native project mapping permissions matching your hardware requirements
          cat <<EOF > package.json
          {
            "name": "drc_elite_golf",
            "version": "0.0.1",
            "private": true,
            "scripts": { "android": "react-native run-android" },
            "dependencies": {
              "react": "18.2.0",
              "react-native": "0.73.6",
              "expo-linear-gradient": "~12.3.0",
              "react-native-safe-area-context": "4.8.2"
            }
          }
          EOF

          # Inject permissions straight into the hard native AndroidManifest.xml file manifest
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml

          npm install --no-audit --no-fund --legacy-peer-deps

      - name: 5. Compile Pure Native Android Binary Build
        run: |
          cd localbuildworkspace/android
          ./gradlew assembleDebug --no-daemon

      - name: 6. Upload Finished App Link Direct to Your Phone
        uses: actions/upload-artifact@v4
        with:
          name: drc-elite-golf-s24-ultra
          path: localbuildworkspace/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
