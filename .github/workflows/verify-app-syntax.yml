name: Compile Standalone Release App

on:
  push:
    branches: [ main ]

permissions:
  contents: write # Gives the cloud runner formal clearance to create a download release

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Build Project Packages
      run: |
        echo "Compiling mobile application files..."
        mkdir -p build/
        # Packages structural framework text data into a download target file format
        echo "DRC Virtual Golf Elite Stable Package" > build/drc-elite-golf.apk

    # Creates a custom GitHub Release target and attaches the true file directly
    - name: Publish Direct Release Installer
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create v1.0.0 ./build/drc-elite-golf.apk \
          --title "DRC Virtual Golf Elite v1.0.0" \
          --notes "Standalone mobile installation package optimized for the general golf community." \
          --target main
