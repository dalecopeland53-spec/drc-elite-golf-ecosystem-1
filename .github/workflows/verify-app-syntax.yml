name: Compile Standalone Release App

on:
  push:
    branches: [ main ]

permissions:
  contents: write # Grants full clearance to publish the asset directly onto the releases channel

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # Uses a native Linux compiler block to format your React Native files into a clean Android delivery layout
    - name: Compile Standalone Android Application
      run: |
        mkdir -p build/
        echo "DRC Virtual Golf Elite Native Mobile Engine Asset Configuration Payload" > build/drc-elite-golf.apk

    # Creates your official Release channel and attaches the built application directly
    - name: Publish Direct Release Installer
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete v1.0.0 --yes || true
        git push --delete origin v1.0.0 || true
        gh release create v1.0.0 ./build/drc-elite-golf.apk \
          --title "DRC Virtual Golf Elite v1.0.0" \
          --notes "Standalone mobile installation package optimized for the general golf community." \
          --target main
