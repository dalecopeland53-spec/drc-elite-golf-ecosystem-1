name: DRC Elite Golf Android Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Modernize speech bindings
        run: |
          python3 - <<'PY'
          p='App.js'
          s=open(p).read()
          s=s.replace("import Voice from'@react-native-voice/voice';", "import {ExpoSpeechRecognitionModule,useSpeechRecognitionEvent}from'expo-speech-recognition';")
          s=s.replace("import Tts from'react-native-tts';", "import * as Speech from'expo-speech';")
          s=s.replace("Tts.setDefaultLanguage('en-AU').catch(()=>{});", "")
          s=s.replace("Tts.speak(a)", "Speech.speak(a,{language:'en-AU'})")
          old="Voice.onSpeechStart=()=>setListening(true);Voice.onSpeechEnd=()=>setListening(false);Voice.onSpeechResults=e=>{let q=e.value?.[0]||'';setHeard(q);if(q){let a=advice(q,bag,units);setHeard(`${q}\\n\\nCaddie: ${a}`);Speech.speak(a,{language:'en-AU'})}};Voice.onSpeechError=()=>setListening(false);return()=>{Voice.destroy().then(Voice.removeAllListeners)}"
          s=s.replace(old,"return()=>{Speech.stop()}")
          s=s.replace("const mic=async()=>{try{listening?await Voice.stop():await Voice.start('en-AU')}catch{Alert.alert('Microphone','Voice could not start. Check microphone permission.')}};", "const mic=async()=>{try{if(listening){ExpoSpeechRecognitionModule.stop();setListening(false);return}let p=await ExpoSpeechRecognitionModule.requestPermissionsAsync();if(!p.granted)return Alert.alert('Microphone','Microphone and speech permission are required.');setListening(true);ExpoSpeechRecognitionModule.start({lang:'en-AU',interimResults:false,continuous:false})}catch{setListening(false);Alert.alert('Microphone','Voice could not start. Check microphone permission.')}};")
          # Insert event hooks inside Shell after state declaration.
          marker="useEffect(()=>{AsyncStorage.getItem(STORAGE)"
          hooks="useSpeechRecognitionEvent('result',e=>{let q=e.results?.[0]?.transcript||'';if(q){let a=advice(q,bag,units);setHeard(`${q}\\n\\nCaddie: ${a}`);Speech.speak(a,{language:'en-AU'})}});useSpeechRecognitionEvent('end',()=>setListening(false));useSpeechRecognitionEvent('error',()=>setListening(false));\n"
          s=s.replace(marker,hooks+marker)
          open(p,'w').write(s)
          PY
          ! grep -q "@react-native-voice/voice\|react-native-tts" App.js
      - name: Validate source
        run: |
          test -f App.js
          test -f CourseMapperScreen.js
          test -f ScorecardScreen.js
          test -f WarmUpScreen.js
          ! grep -R "const PARS =;" --include='*.js' .
      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android
      - name: Build real release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: mkdir -p output && cp android/app/build/outputs/apk/release/app-release.apk output/DRC-Elite-Golf-Build-1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DRC-Elite-Golf-Build-1
          path: output/DRC-Elite-Golf-Build-1.apk
          if-no-files-found: error
          retention-days: 14
