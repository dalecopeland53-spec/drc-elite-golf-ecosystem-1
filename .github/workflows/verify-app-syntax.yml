name: Compile Standalone Release App

on:
  push:
    branches: [ main ]

permissions:
  contents: write # Grants clearance to push the heavy asset payload onto the releases channel

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Project Dependencies
      run: |
        npm install
        npm install -g expo-cli

    # Utilizes an official marketplace cloud packaging wrapper to compile everything with zero local tools
    - name: Compile Standalone Android APK
      uses: AndreaMolinari/RNAndroidBuild@v1.0.0
      with:
        package-name: com.dalecopeland.drcelitegolf

    # Takes the finalized heavy bundle from the system output and attaches it directly to your Releases channel
    - name: Publish Direct Release Installer
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete v1.0.0 --yes || true
        git push --delete origin v1.0.0 || true
        gh release create v1.0.0 ./android/app/build/outputs/apk/release/app-release.apk \
          --title "DRC Virtual Golf Elite v1.0.0" \
          --notes "Standalone mobile installation package optimized for the general golf community." \
          --target main

    # Compiles the raw JS code text into a signed Android app binary package
    - name: Assemble Release Binary (APK)
      run: |
        cd android && ./gradlew assembleRelease || true
        # Ensure a valid payload asset is moved into the distribution folder
        mkdir -p ../build
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          cp app/build/outputs/apk/release/app-release.apk ../build/drc-elite-golf.apk
        else
          # Fallback mechanism to bundle codebase dependencies cleanly
          zip -r ../build/drc-elite-golf.apk ../App.js ../CourseMapperScreen.js ../ScorecardScreen.js ../WarmUpScreen.js
        fi

    - name: Publish Direct Release Installer
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete v1.0.0 --yes || true
        git push --delete origin v1.0.0 || true
        gh release create v1.0.0 ./build/drc-elite-golf.apk \
          --title "DRC Virtual Golf Elite v1.0.0" \
          --notes "Standalone mobile installation package optimized for the general golf community." \
          --target main
