name: Verify DRC Mobile App Syntax

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-javascript:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Verify App Blueprint Exists
      run: |
        if [ -f "./App.js" ]; then
          echo "Success: App.js blueprint is securely saved in the cloud repository!"
          exit 0
        else
          echo "Error: App.js file not found."
          exit 1
        fi
